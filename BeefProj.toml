FileVersion = 1
Dependencies = {corlib = "*", corlib = "*"}

[Project]
Name = "Juno"
TargetType = "BeefLib"
StartupObject = "Juno.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Juno.lib"]
PreBuildCmds = ["\"$(ProjectDir)/bin/build.bat\" \"$(ProjectDir)/Juno.vcxproj\" /p:Configuration=Debug /p:Platform=X64 /p:OutDir=\"$(ProjectDir)/dist/\" /p:IntDir=\"$(BuildDir)/\" /v:m\""]

[[ProjectFolder.Items]]
Type = "Source"
Path = ".gitignore"

[[ProjectFolder.Items]]
Type = "Source"
Path = "BeefProj.toml"

[[ProjectFolder.Items]]
Type = "Source"
Path = "BeefSpace.toml"

[[ProjectFolder.Items]]
Type = "Source"
Path = "Juno.sln"

[[ProjectFolder.Items]]
Type = "Source"
Path = "Juno.vcxproj"

[[ProjectFolder.Items]]
Type = "Source"
Path = "LICENSE"

[[ProjectFolder.Items]]
Type = "Source"
Path = "README.md"
